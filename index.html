<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raid Manager 2025</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .act-header { min-width: 120px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

<div id="app" class="max-w-7xl mx-auto p-3 md:p-8">
    <header class="mb-6 flex flex-col gap-4">
        <div class="flex justify-between items-start">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="zap" class="text-blue-600"></i> Raid Manager
                </h1>
                <p class="text-slate-500 text-sm italic">Synchronisation par lien activée</p>
            </div>
            <button onclick="shareConfig()" class="bg-blue-600 text-white p-2.5 rounded-xl hover:bg-blue-700 transition-all flex items-center gap-2 font-medium text-sm shadow-md">
                <i data-lucide="share-2" size="18"></i> <span>Partager</span>
            </button>
        </div>
        
        <div class="flex flex-wrap gap-2">
            <button onclick="addParticipant()" class="flex-1 md:flex-none flex items-center justify-center gap-2 bg-emerald-600 text-white px-4 py-2.5 rounded-xl hover:bg-emerald-700 transition-colors shadow-sm font-medium text-sm">
                <i data-lucide="user-plus" size="18"></i> Nouveau Participant
            </button>
            <button onclick="requestNotificationPermission()" id="btn-notif" class="flex-1 md:flex-none flex items-center justify-center gap-2 bg-orange-500 text-white px-4 py-2.5 rounded-xl hover:bg-orange-600 transition-colors shadow-sm font-medium text-sm">
                <i data-lucide="bell" size="18"></i> Alertes
            </button>
        </div>
    </header>

    <div id="participants-container" class="grid grid-cols-1 gap-8"></div>
</div>

<script>
    function getInitialData() {
        const urlParams = new URLSearchParams(window.location.search);
        const sharedData = urlParams.get('d');
        if (sharedData) {
            try {
                const decoded = JSON.parse(decodeURIComponent(escape(atob(sharedData))));
                localStorage.setItem('raid_2025_final', JSON.stringify(decoded));
                return decoded;
            } catch (e) { console.error("Erreur de lien"); }
        }
        return JSON.parse(localStorage.getItem('raid_2025_final')) || [];
    }

    let participants = getInitialData();

    function saveData() {
        localStorage.setItem('raid_2025_final', JSON.stringify(participants));
    }

    function shareConfig() {
        saveData();
        const base64Data = btoa(unescape(encodeURIComponent(JSON.stringify(participants))));
        const shareUrl = window.location.origin + window.location.pathname + "?d=" + base64Data;
        navigator.clipboard.writeText(shareUrl).then(() => alert("Lien copié !"));
    }

    function addParticipant() {
        const name = prompt("Nom ?");
        if (name) { participants.push({ id: crypto.randomUUID(), name, activities: ["Activité 1"], items: [] }); saveData(); render(); }
    }

    function removeParticipant(pIdx) {
        if(confirm(`Supprimer ${participants[pIdx].name} ?`)) { participants.splice(pIdx, 1); saveData(); render(); }
    }

    function addActivity(pIdx) {
        const act = prompt("Nom de l'activité ?");
        if (act) { participants[pIdx].activities.push(act); saveData(); render(); }
    }

    function removeActivity(pIdx, actIdx) {
        if(confirm("Supprimer cette activité ?")) {
            const actName = participants[pIdx].activities[actIdx];
            participants[pIdx].items.forEach(item => delete item.assignments[actName]);
            participants[pIdx].activities.splice(actIdx, 1);
            saveData(); render();
        }
    }

    function moveActivity(pIdx, actIdx, dir) {
        const acts = participants[pIdx].activities;
        if (actIdx + dir >= 0 && actIdx + dir < acts.length) {
            [acts[actIdx], acts[actIdx + dir]] = [acts[actIdx + dir], acts[actIdx]];
            saveData(); render();
        }
    }

    function addItem(pIdx) {
        const name = prompt("Nom du matériel ?");
        if (name) { participants[pIdx].items.push({ id: crypto.randomUUID(), name, assignments: {} }); saveData(); render(); }
    }

    function removeItem(pIdx, iIdx) {
        if(confirm("Supprimer ce matériel ?")) { participants[pIdx].items.splice(iIdx, 1); saveData(); render(); }
    }

    function toggleAssignment(pIdx, iIdx, act) {
        const item = participants[pIdx].items[iIdx];
        item.assignments[act] = item.assignments[act] ? undefined : ["12:00"];
        if (!item.assignments[act]) delete item.assignments[act];
        saveData(); render();
    }

    function updateTime(pIdx, iIdx, act, tIdx, val) {
        participants[pIdx].items[iIdx].assignments[act][tIdx] = val;
        saveData();
    }

    function addTime(pIdx, iIdx, act) {
        participants[pIdx].items[iIdx].assignments[act].push("12:00");
        saveData(); render();
    }

    function removeTime(pIdx, iIdx, act, tIdx) {
        participants[pIdx].items[iIdx].assignments[act].splice(tIdx, 1);
        saveData(); render();
    }

    function requestNotificationPermission() {
        Notification.requestPermission().then(p => { if(p === "granted") alert("Activé !"); });
    }

    function render() {
        const container = document.getElementById('participants-container');
        container.innerHTML = '';
        participants.forEach((p, pIdx) => {
            const card = document.createElement('div');
            card.className = "bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden mb-8";
            card.innerHTML = `
                <div class="bg-slate-800 p-4 flex justify-between items-center text-white">
                    <h2 class="font-bold flex items-center gap-2"><i data-lucide="user" size="18"></i> ${p.name}</h2>
                    <div class="flex gap-2">
                        <button onclick="addActivity(${pIdx})" class="text-[10px] bg-slate-700 px-2 py-1 rounded">+ ACT</button>
                        <button onclick="removeParticipant(${pIdx})" class="text-red-400"><i data-lucide="trash-2" size="18"></i></button>
                    </div>
                </div>
                <div class="p-4 overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-slate-400 text-[10px] uppercase tracking-widest">
                                <th class="pb-6 w-48">Matériel</th>
                                ${p.activities.map((a, aIdx) => `
                                    <th class="pb-6 px-2 text-center act-header">
                                        <div class="flex flex-col items-center gap-2">
                                            <div class="flex items-center gap-2 bg-slate-100 rounded-lg p-1">
                                                <button onclick="moveActivity(${pIdx}, ${aIdx}, -1)" class="hover:text-blue-600"><i data-lucide="chevron-left" size="14"></i></button>
                                                <button onclick="removeActivity(${pIdx}, ${aIdx})" class="hover:text-red-500"><i data-lucide="trash" size="12"></i></button>
                                                <button onclick="moveActivity(${pIdx}, ${aIdx}, 1)" class="hover:text-blue-600"><i data-lucide="chevron-right" size="14"></i></button>
                                            </div>
                                            <span class="text-slate-700 text-xs font-bold block w-full truncate">${a}</span>
                                        </div>
                                    </th>
                                `).join('')}
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            ${p.items.map((item, iIdx) => `
                                <tr class="group">
                                    <td class="py-4 font-semibold text-slate-700 flex items-center justify-between">
                                        <span class="truncate pr-2">${item.name}</span>
                                        <button onclick="removeItem(${pIdx}, ${iIdx})" class="opacity-0 group-hover:opacity-100 text-red-300 hover:text-red-500"><i data-lucide="x-circle" size="16"></i></button>
                                    </td>
                                    ${p.activities.map(act => {
                                        const times = item.assignments[act];
                                        return `
                                            <td class="py-4 px-2 text-center">
                                                <div class="flex flex-col items-center gap-2">
                                                    <button onclick="toggleAssignment(${pIdx}, ${iIdx}, '${act}')" 
                                                        class="w-9 h-9 rounded-xl flex items-center justify-center transition-all ${times ? 'bg-emerald-500 text-white shadow-md' : 'bg-slate-100 text-slate-300 hover:bg-slate-200'}">
                                                        <i data-lucide="${times ? 'check' : 'plus'}" size="18"></i>
                                                    </button>
                                                    ${times ? `<div class="space-y-1 w-full max-w-[90px]">
                                                        ${times.map((t, tIdx) => `<div class="flex items-center gap-1 bg-white border rounded p-1 shadow-sm">
                                                            <input type="time" value="${t}" onchange="updateTime(${pIdx}, ${iIdx}, '${act}', ${tIdx}, this.value)" class="text-[10px] w-full outline-none">
                                                            <button onclick="removeTime(${pIdx}, ${iIdx}, '${act}', ${tIdx})" class="text-slate-300 hover:text-red-500"><i data-lucide="x" size="10"></i></button>
                                                        </div>`).join('')}
                                                        <button onclick="addTime(${pIdx}, ${iIdx}, '${act}')" class="text-[9px] text-blue-500 font-bold">+ HEURE</button>
                                                    </div>` : ''}
                                                </div>
                                            </td>`;
                                    }).join('')}
                                </tr>`).join('')}
                        </tbody>
                    </table>
                    <button onclick="addItem(${pIdx})" class="mt-6 w-full py-3 border-2 border-dashed border-slate-200 rounded-2xl text-slate-400 text-xs font-bold hover:bg-slate-50 transition-all uppercase tracking-widest">+ Ajouter matériel</button>
                </div>`;
            container.appendChild(card);
        });
        lucide.createIcons();
    }
    window.onload = render;
</script>
</body>
</html>
